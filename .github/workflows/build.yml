name: Build

permissions:
  contents: read

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.os }} / ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
            # Using tauri-apps/tauri-action@v0 because it handles the tauri-cli installation,
            # cross-compilation setup, and signing integration in one maintained action.
            # The alternative (cargo install tauri-cli --version '^2' --locked) would require
            # manual cache management and separate cross-compilation config per platform.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    steps:
      - uses: actions/checkout@v4

      # Linux dependencies
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # Windows dependencies - WebView2 bootstrapper is pre-installed on windows-latest
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # macOS signing (optional - only used when all secrets are present)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (optional - document Azure Trusted Signing or WINDOWS_CERTIFICATE)
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Updater signing (optional) - only set when secrets exist to avoid empty vars triggering signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: hermes-tauri-v__VERSION__
          releaseName: 'Hermes Tauri v__VERSION__'
          releaseBody: 'See CHANGELOG.md'
          releaseDraft: true
          prerelease: false
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Draft Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*
          merge-multiple: false

      - name: Prepare release assets
        id: assets
        run: |
          # Find all bundle files
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.nsis.exe" -o -name "*.msi" \) | sort
          # Also find .sig files for updater
          find artifacts -type f -name "*.sig" | sort

      - name: Generate latest.json for updater
        id: latest
        run: |
          # Tauri v2 updater format - only generate if .sig files exist
          SIG_FILES=$(find artifacts -type f -name "*.sig" 2>/dev/null | wc -l)
          if [ "$SIG_FILES" -gt 0 ]; then
            echo "Generating latest.json from signature files..."
            # The tauri-action would normally generate this, but we can create it manually if needed
            # For now, we note that signatures exist
            echo "signatures_found=true" >> $GITHUB_OUTPUT
          else
            echo "No signature files found, skipping latest.json generation"
            echo "signatures_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.nsis.exe
            artifacts/**/*.msi
            artifacts/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}