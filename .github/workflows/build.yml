name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# One run per ref: supersede an in-flight run only for pull requests, so a
# main push or a tagged release build is never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

      # The cfg(windows) code was never type-checked anywhere (R7): the Linux
      # job only ever built the Linux target, and the Windows job only runs the
      # build, so two missing windows-sys features and a missing method in
      # hermes-sidecar stayed invisible until `cargo tauri build` on Windows.
      - name: Add the Windows target std
        run: rustup target add x86_64-pc-windows-msvc

      - name: Check the Windows code paths (cargo check and clippy)
        run: |
          # `cargo check` emits metadata and never links, so the C and assembly
          # parts of the two C dependencies (ring, through ureq's TLS, and
          # zstd-sys, through hermes-shell-config) are not needed: this runner
          # has no MSVC toolchain, and no C artifact reaches a link step. The
          # stand-in has to create the file cc-rs asks for, because cc-rs
          # hard-links the archive its archiver was meant to produce.
          cat > "$RUNNER_TEMP/noop-msvc-tool.sh" <<'SH'
          #!/bin/sh
          # Stand-in for cl.exe and lib.exe: create the requested output, succeed.
          out=
          for arg in "$@"; do
            case "$arg" in
              -out:*) out=${arg#-out:} ;;
              /Fo*) out=${arg#/Fo} ;;
            esac
          done
          if [ -n "$out" ]; then
            mkdir -p "$(dirname "$out")" && : > "$out"
          fi
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/noop-msvc-tool.sh"
          export CC_x86_64_pc_windows_msvc="$RUNNER_TEMP/noop-msvc-tool.sh"
          export AR_x86_64_pc_windows_msvc="$RUNNER_TEMP/noop-msvc-tool.sh"
          cargo check --locked --target x86_64-pc-windows-msvc --all-targets \
            -p hermes-sidecar -p hermes-shell-config
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets \
            -p hermes-sidecar -p hermes-shell-config -- -D warnings

  # The Rust tests on the two non-Linux runners (Linux runs them in `check`).
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.os }} / ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
            smoke: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            smoke: true
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            smoke: true
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
            smoke: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            smoke: true

    steps:
      - uses: actions/checkout@v4

      # Linux dependencies
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # Windows dependencies - WebView2 bootstrapper is pre-installed on windows-latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # Prepare signing env: only write non-empty secrets to GITHUB_ENV.
      # tauri-action reads these at runtime; empty vars would trigger signing attempts and fail.
      # Use heredoc with a random delimiter so a secret can never end the block early.
      # `shell: bash` is required: this script is bash (set -euo pipefail, ${!var},
      # heredocs, openssl), while `run:` on a Windows runner defaults to
      # PowerShell, where it failed before the build even started (R7).
      - name: Prepare signing environment
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: document Azure Trusted Signing or WINDOWS_CERTIFICATE
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Single-line secrets: write NAME=value only when set and non-empty
          for var in \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            val="${!var}"
            if [ -n "$val" ]; then
              echo "$var=$val" >> "$GITHUB_ENV"
            fi
          done
          # Multiline secrets: use heredoc with random delimiter
          for var in APPLE_CERTIFICATE TAURI_SIGNING_PRIVATE_KEY; do
            val="${!var}"
            if [ -n "$val" ]; then
              delim="EOF_$(openssl rand -hex 8)"
              {
                echo "$var<<$delim"
                echo "$val"
                echo "$delim"
              } >> "$GITHUB_ENV"
            fi
          done
          # When TAURI_SIGNING_PRIVATE_KEY is present, enable updater artifacts via config file
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            # Write updater config to a temp file (tauri-cli v2 accepts --config <path>)
            printf '{"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/updater.conf.json"
            echo "updater_config=--config $RUNNER_TEMP/updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "updater_config=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        # Using tauri-apps/tauri-action@v0 because it handles the tauri-cli installation,
        # cross-compilation setup, and signing integration in one maintained action.
        # The alternative (cargo install tauri-cli --version '^2' --locked) would require
        # manual cache management and separate cross-compilation config per platform.
        with:
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ steps.signing.outputs.updater_config }} -- --locked

      # Headless smoke test: launch the release binary with no backend
      # configured and no `hermes` on PATH. The shell must come up, show its
      # boot page ("No Hermes configured") and still be running 25 s later.
      # Skipped for x86_64-apple-darwin, which is cross-built on an ARM runner.
      - name: Smoke test (Linux, Xvfb)
        if: runner.os == 'Linux' && matrix.smoke
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11
          BIN="target/${{ matrix.target }}/release/hermes-tauri"
          test -x "$BIN"
          mkdir -p "$RUNNER_TEMP/smoke-home"
          set +e
          HOME="$RUNNER_TEMP/smoke-home" timeout 25 dbus-run-session -- \
            xvfb-run -a -s "-screen 0 1280x800x24" "$BIN" > smoke.log 2>&1
          rc=$?
          set -e
          cat smoke.log
          # 124: still running when the timeout fired, so the shell started and stayed up.
          if [ "$rc" != 124 ]; then echo "::error::hermes-tauri exited early (rc=$rc)"; exit 1; fi
          echo "smoke ok: hermes-tauri stayed up for 25 s"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS' && matrix.smoke
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/hermes-tauri"
          test -x "$BIN"
          "$BIN" > smoke.log 2>&1 &
          pid=$!
          sleep 25
          if ! kill -0 "$pid" 2>/dev/null; then
            cat smoke.log; wait "$pid"; echo "::error::hermes-tauri exited early (rc=$?)"; exit 1
          fi
          kill "$pid" || true
          cat smoke.log
          echo "smoke ok: hermes-tauri stayed up for 25 s"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows' && matrix.smoke
        shell: pwsh
        run: |
          $exe = "target\${{ matrix.target }}\release\hermes-tauri.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Error "hermes-tauri exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Output "smoke ok: hermes-tauri stayed up for 25 s"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          # Explicit globs for deliverable files only (not extracted package internals like AppDir/, .app/Contents/, DEBIAN/).
          # upload-artifact v4 with common-root places files at <bundle-type>/<file> inside the artifact.
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Draft Release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*
          merge-multiple: false

      - name: Stage release artifacts and generate latest.json
        id: stage
        run: |
          bash scripts/ci/stage-release.sh

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}