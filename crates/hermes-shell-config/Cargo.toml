[package]
name = "hermes-shell-config"
description = "Resolves the Hermes backend source (flag, env, config.toml) and installs the bundled payload"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fs4 = "1"
hermes-sidecar = { path = "../hermes-sidecar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
toml = "0.8"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
# The ignored bundled-payload test talks to the real payload over HTTP.
ureq = "2"
