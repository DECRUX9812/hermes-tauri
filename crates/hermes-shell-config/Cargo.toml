[package]
name = "hermes-shell-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hermes-sidecar = { path = "../hermes-sidecar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# The ignored bundled-payload test talks to the real payload over HTTP.
ureq = "2"
