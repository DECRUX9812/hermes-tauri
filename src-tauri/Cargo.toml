[package]
name = "hermes-tauri"
version = "0.1.0"
description = "An optional Tauri v2 desktop shell for the Hermes desktop web UI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hermes-sidecar = { path = "../crates/hermes-sidecar" }
hermes-shell-config = { path = "../crates/hermes-shell-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["dynamic-acl", "tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
ctrlc = { version = "3", features = ["termination"] }
# Pin: tauri-plugin-deep-link 2.6.2 does not compile against rust-ini 0.21.3.
rust-ini = "=0.21.1"
